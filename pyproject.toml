[project]

name = "nfl-projection-model"
version = "0.1.0"
description = "NFL yardage and touchdown projections with scheme-transfer modelling across coaching changes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "altair>=5.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "requests>=2.32",
    "scipy>=1.13",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.poetry]
package-mode = false
